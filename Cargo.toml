[package]
name = "frinZ"
version = "5.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Masanori AKIMOTO <masanori.akimoto.ac@gmail.com>"]
description = "fringe search for Yamaguchi Interferometer and Japanese VLBI Network"
repository = "https://github.com/M-AKIMOTOO/frinZrs"
documentation = "https://docs.rs/frinZ"
readme = "README.md"    
include = ["src/frinZmain/", "src/frinZtable/", "!src/frinZmain/*.orig", "README.md", "docs/mbcor.md", "LICENSE", "LICENSE-3RD-PARTY-WWZ"]

[workspace]
members = ["tools", "xtask"]
default-members = [".", "tools"]

[lib]
path = "src/frinZmain/lib.rs"

[[bin]]
name = "frinZ"
path = "src/frinZmain/main.rs"

[[bin]]
name = "frinZtable"
path = "src/frinZtable/main.rs"
required-features = ["table-gui"]

[features]
default = ["table-gui"]
table-gui = ["dep:eframe", "dep:egui_plot", "dep:rfd", "dep:anyhow", "dep:csv"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
incremental = false
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
incremental = false
overflow-checks = false

[dependencies]
eframe = { version = "=0.32.3", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = { version = "=0.33.0", optional = true }
rfd = { version = "0.15.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = { version = "1", optional = true }
chrono        = "0.4.22"
num-complex   = "0.4.2"
rustfft       = "6.1.0"
byteorder     = "1.4.3"
nalgebra = "0.33"
ndarray       = "0.16.1"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "ttf", "datetime", "line_series", "point_series", "full_palette", "colormaps"] }
clap          = { version = "4.4.6", features = ["derive"] }
astro         = "2.0.0"
erfa          = "0.2.1"
nav-types     = "0.5"
image = { version = "0.25.6", default-features = false, features = ["png"] }
png = "0.17"
terminal_size = "0.4"
rayon = "1.10"
sys-info      = "0.9"
memmap2 = "0.9"
csv = { version = "1.3.1", optional = true }
zstd = "0.13"
tempfile = "3.13"
