[package]
name = "frinZ-tools"
version = "4.2.3"
edition = "2021"
publish = false

[[bin]]
name = "cormerge"
path = "../src/cormerge/main.rs"

[[bin]]
name = "gfrinZ"
path = "../src/gfrinZmain/main.rs"

[[bin]]
name = "bandscythe"
path = "../src/bandscythe/main.rs"

[[bin]]
name = "pulsar_gating"
path = "../src/pulsar_gating/main.rs"

[dependencies]
anyhow = "1"
astro = "2.0.0"
byteorder = "1.4.3"
chrono = "0.4.22"
clap = { version = "4.4.6", features = ["derive"] }
csv = "1.3.1"
frinZ = { path = ".." }
memmap2 = "0.9"
nalgebra = "0.33"
ndarray = "0.16.1"
num-complex = "0.4.2"
plotters = "0.3.7"
image = { version = "0.25.6", features = ["png"] }
imagequant = "4.4.1"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
