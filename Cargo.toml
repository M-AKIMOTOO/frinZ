[package]
name = "frinZ"
version = "4.11.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Masanori AKIMOTO <masanori.akimoto.ac@gmail.com>"]
description = "fringe search for Yamaguchi Interferometer and Japanese VLBI Network"
repository = "https://github.com/M-AKIMOTOO/frinZrs"
documentation = "https://docs.rs/frinZ"
readme = "README.md"    
include = ["src/frinZmain/", "!src/frinZmain/*.orig", "README.md", "LICENSE", "LICENSE-3RD-PARTY-WWZ"]

[workspace]
members = ["tools", "xtask"]
default-members = [".", "tools"]

[lib]
path = "src/frinZmain/lib.rs"

[[bin]]
name = "frinZ"
path = "src/frinZmain/main.rs"

[features]
default = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
incremental = false
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
incremental = false
overflow-checks = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
chrono        = "0.4.22"
num-complex   = "0.4.2"
rustfft       = "6.1.0"
byteorder     = "1.4.3"
nalgebra = "0.33"
ndarray       = "0.16.1"
plotters      = "0.3.7"
clap          = { version = "4.4.6", features = ["derive"] }
astro         = "2.0.0"
nav-types     = "0.5"
image = { version = "0.25.6", features = ["png"] }
imageproc     = "0.25.0"
imagequant = "4.4.1"
png = "0.17"
terminal_size = "0.4"
rayon = "1.10"
sys-info      = "0.9"
memmap2 = "0.9"
csv = "1.3.1"
zstd = "0.13"
tempfile = "3.13"
npyz = { version = "0.8.4", features = ["derive"] }
flate2 = "1.1.9"
crc32fast = "1.5.0"
